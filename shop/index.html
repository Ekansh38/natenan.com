<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shop — natenan.com</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../animations.css">
</head>
<body>
    <header>
        <a href="../index.html" class="site-title">natenan.com</a>
        <a href="../index.html" class="back-link">← back</a>
    </header>

    <main class="section-page shop-page">

        <div class="shop-hero">
            <p class="shop-season">S / S &nbsp; 2 0 2 5</p>
            <p class="shop-brand">bypharodelix</p>
            <h1 class="shop-title">SZN&nbsp;II</h1>
            <p class="shop-drop">available now</p>
        </div>

        <div class="shop-grid">

            <div class="shop-item">
                <div class="shop-pair">
                    <div class="shop-img-wrap">
                        <img src="../assets/szn2-ts02-a.png" alt="TS-02 front">
                        <span class="shop-view-label">front</span>
                    </div>
                    <div class="shop-img-wrap">
                        <img src="../assets/szn2-ts02-b.png" alt="TS-02 back">
                        <span class="shop-view-label">back</span>
                    </div>
                </div>
                <div class="shop-meta">
                    <span class="shop-code">TS-02</span>
                    <span class="shop-name">"PRAY FOR TIMES LIKE THIS"</span>
                    <a href="../contact.html" class="shop-cta">INQUIRE</a>
                </div>
            </div>

            <div class="shop-item shop-item-single">
                <div class="shop-img-wrap">
                    <img src="../assets/szn2-hd02.png" alt="HD-02">
                </div>
                <div class="shop-meta">
                    <span class="shop-code">HD-02</span>
                    <span class="shop-name">"BYPHARODELIX"</span>
                    <a href="../contact.html" class="shop-cta">INQUIRE</a>
                </div>
            </div>

            <div class="shop-item">
                <div class="shop-pair">
                    <div class="shop-img-wrap">
                        <img src="../assets/szn2-ts03-a.png" alt="TS-03 front">
                        <span class="shop-view-label">front</span>
                    </div>
                    <div class="shop-img-wrap">
                        <img src="../assets/szn2-ts03-b.png" alt="TS-03 back">
                        <span class="shop-view-label">back</span>
                    </div>
                </div>
                <div class="shop-meta">
                    <span class="shop-code">TS-03</span>
                    <span class="shop-name">"REPITION-UNWOUND"</span>
                    <a href="../contact.html" class="shop-cta">INQUIRE</a>
                </div>
            </div>

        </div>

        <p class="shop-footer-note">dm or email to purchase &nbsp;/&nbsp; limited pieces</p>

    </main>

    <script src="../animations.js"></script>
</body>
</html>
